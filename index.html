<style>
/* Layout: app de uma tela. Cabeçalho marinho; painel com o atendimento em 3 passos + mapa vetorial.
   Celular: mapa em cima, painel embaixo. Tela larga: painel à esquerda. */
:root{
  --bg:#F2F4F3; --panel:#FFFFFF; --panel-2:#F6F7F6; --ink:#14222E; --muted:#56646F; --line:#DCE1E3;
  --navy:#0C2D48; --sky:#1E9BD7; --sky-soft:#E3F2FA; --focus:#1E9BD7; --cta:#0C2D48; --cta-ink:#FFFFFF;
  --outside:#DDE3E4; --land:#EEECE6; --land-edge:#FFFFFF; --park:#CFE2C6; --river:#86C0DF; --road:#FFFFFF; --road-edge:#CFC8BA;
  --doc:#1F5F99; --aco:#B8532F; --edu:#2F7D4F; --com:#8A6A14; --warn:#A8261C; --warn-soft:#FBE9E7;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171E; --panel:#14212A; --panel-2:#192833; --ink:#E3EBF0; --muted:#9BABB6; --line:#26363F;
  --navy:#0A2236; --sky:#4CB4E8; --sky-soft:#173446; --focus:#4CB4E8; --cta:#4CB4E8; --cta-ink:#06131B;
  --outside:#0A1218; --land:#1A2730; --land-edge:#0E171E; --park:#1E3829; --river:#2D6584; --road:#33434D; --road-edge:#24323B;
  --doc:#6AA7DF; --aco:#E58660; --edu:#62B886; --com:#D2AC4A; --warn:#F28B80; --warn-soft:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171E; --panel:#14212A; --panel-2:#192833; --ink:#E3EBF0; --muted:#9BABB6; --line:#26363F;
  --navy:#0A2236; --sky:#4CB4E8; --sky-soft:#173446; --focus:#4CB4E8; --cta:#4CB4E8; --cta-ink:#06131B;
  --outside:#0A1218; --land:#1A2730; --land-edge:#0E171E; --park:#1E3829; --river:#2D6584; --road:#33434D; --road-edge:#24323B;
  --doc:#6AA7DF; --aco:#E58660; --edu:#62B886; --com:#D2AC4A; --warn:#F28B80; --warn-soft:#3A1F1C; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);margin:0;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}
header img{height:30px;width:auto;display:block}
header .sp{flex:1}
.hb{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.hb img{height:14px;width:auto;border-radius:2px}
.main{display:grid;grid-template-columns:420px 1fr;min-height:0}
.panel{position:relative;background:var(--panel);border-inline-end:1px solid var(--line);overflow-y:auto;min-height:0;display:flex;flex-direction:column}
#map{min-height:0;background:var(--outside)}
.leaflet-container{background:var(--outside);font:inherit}
@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,34%) minmax(0,66%)}
  #map{grid-row:1}
  .panel{grid-row:2;border-inline-end:0;border-top:1px solid var(--line)}
  .main.mapbig{grid-template-rows:minmax(0,60%) minmax(0,40%)}
  header{padding:8px 12px;gap:8px} header img{height:24px}
  .hb{padding:6px 8px;font-size:13px}
}
.pad{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:20px;line-height:1.25;font-weight:600}
h3{font-size:15px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.note{font-size:12.5px;color:var(--muted);line-height:1.4}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;background:none;border:0;padding:12px 8px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sky)}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--sky)}

/* idioma */
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lb{display:flex;flex-direction:column;align-items:flex-start;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;cursor:pointer;text-align:start;min-height:72px}
.lb:hover{border-color:var(--sky)}
.lb[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.lb .fl{display:flex;flex-wrap:wrap;gap:3px}
.lb .fl img{height:15px;width:20px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.12);display:block}
.lb b{font-size:16px;font-weight:600}
.multi{font-size:12.5px;color:var(--muted);line-height:1.6}
.multi span{white-space:nowrap}

/* lugar */
.arr{display:grid;grid-template-columns:1fr;gap:6px}
.ab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:start;font-weight:500}
.ab:hover{border-color:var(--sky)}
.ab .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--sky-soft);font-size:16px;flex:none}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:11px 12px}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);margin-top:6px;overflow:hidden}
.sug button{background:var(--panel);border:0;border-bottom:1px solid var(--line);text-align:start;padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sug button:last-child{border-bottom:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px;line-height:1.2}
.chip:hover{border-color:var(--sky)}
.lines{display:inline-flex;gap:3px;flex-wrap:wrap;direction:ltr}
.ln{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 4px;border-radius:4px;color:#fff;font:600 11px/1 var(--f-cond)}
.sub{font-size:13px;font-weight:600;color:var(--muted)}

/* necessidades */
.needs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nb{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;cursor:pointer;text-align:start;font-weight:600;font-size:15px;line-height:1.2;min-height:58px}
.nb .em{font-size:24px;line-height:1;flex:none}
.nb[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.nb.danger{border-color:var(--warn)}
.nb.danger[aria-pressed="true"]{background:var(--warn-soft)}
.go{background:var(--cta);color:var(--cta-ink);border:0;border-radius:var(--r);padding:13px 16px;font-weight:600;font-size:16px;cursor:pointer;width:100%}
.go:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;color:var(--sky);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.back{align-self:flex-start}

/* resultado */
.alert{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.alert strong{color:var(--warn)}
.tel{font-variant-numeric:tabular-nums;font-weight:600;user-select:all;direction:ltr;unicode-bidi:isolate}
.guide{border-inline-start:3px solid var(--sky);padding-inline-start:12px;display:flex;flex-direction:column;gap:4px}
.guide h3{display:flex;gap:7px;align-items:center}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;display:grid;grid-template-columns:auto 1fr;gap:4px 11px;background:var(--panel)}
.card .num{grid-column:1;grid-row:1 / span 8}
.card > *:not(.num){grid-column:2;min-width:0}
.card .nm{font-weight:600;line-height:1.25}
.card .ds{font-size:14px}
.card .ad{font-size:13px;color:var(--muted);direction:ltr;unicode-bidi:isolate;text-align:start}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.card .act{display:flex;flex-wrap:wrap;gap:16px;margin-top:4px;font-size:14px}
.card .act a{color:var(--sky);font-weight:600}
.why{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.tag.c{border-color:var(--com);color:var(--com);font-weight:600}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font:700 13px/1 var(--f-body);font-variant-numeric:tabular-nums}
.sel{outline:2px solid var(--sky);outline-offset:1px}
.free{font-size:13px;font-weight:600;color:var(--edu)}

/* lista */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--panel);cursor:pointer;font-size:13px}
.fchip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fchip[aria-pressed="false"]{opacity:.5}

/* mapa */
.pin{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;font:700 13px/1 "IBM Plex Sans",system-ui,sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.on{transform:scale(1.25);box-shadow:0 0 0 4px rgba(30,155,215,.45)}
.hub{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--panel);border:1.5px solid var(--ink);font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.me-pin{width:18px;height:18px;border-radius:50%;background:var(--sky);border:3px solid #fff;box-shadow:0 0 0 6px rgba(30,155,215,.3)}
.dlabel{font:500 11px/1.1 var(--f-cond);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-align:center;pointer-events:none;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.slabel{font:600 11px/1.1 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);white-space:nowrap;pointer-events:none;text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land)}
#map, #map *{direction:ltr}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.4}
.leaflet-popup-content b{display:block;font-size:14px;margin-bottom:2px}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
.maplegend{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.maplegend label{display:flex;gap:5px;align-items:center;cursor:pointer}

/* IA */
.ai{border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.ai textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--panel);resize:vertical}
.ai .row{display:flex;gap:12px;align-items:center}
.ai .row .go{width:auto}
.ai .log{display:flex;flex-direction:column;gap:10px}
.bub{max-width:92%;padding:10px 13px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--sky-soft);border-color:transparent}
footer.src{padding:10px 18px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

brigo no CREAS da sua região ou ligue 156. O CRAI também ajuda. O Arsenal da Esperança é só para homens.", "es": "Pide un lugar en un albergue en el CREAS de tu región o llama al 156. El CRAI también ayuda. El Arsenal da Esperança es solo para hombres.", "en": "Ask for a shelter place at the CREAS in your area or call 156. CRAI also helps. Arsenal da Esperança is for men only.", "fr": "Demandez une place en foyer au CREAS de votre zone ou appelez le 156. Le CRAI aide aussi. L'Arsenal da Esperança est seulement pour les hommes.", "ht": "Mande yon plas nan abri nan CREAS zòn ou oswa rele 156. CRAI ede tou. Arsenal da Esperança se pou gason sèlman.", "ar": "اطلب مكاناً في مأوى من مركز CREAS في منطقتك أو اتصل بـ 156. مركز CRAI يساعد أيضاً. Arsenal da Esperança للرجال فقط.", "ur": "اپنے علاقے کے CREAS میں پناہ گاہ میں جگہ مانگیں یا 156 پر کال کریں۔ CRAI بھی مدد کرتا ہے۔ Arsenal da Esperança صرف مردوں کے لیے ہے۔", "fa": "از CREAS منطقهٔ خود جای در پناهگاه بخواهید یا به ۱۵۶ زنگ بزنید. CRAI هم کمک می‌کند. Arsenal da Esperança فقط برای مردان است.", "ps": "د خپلې سیمې له CREAS څخه په پناه ځای کې ځای وغواړئ یا ۱۵۶ ته زنګ ووهئ. CRAI هم مرسته کوي. Arsenal da Esperança یوازې د نارینه وو لپاره دی.", "it": "Chiedi un posto in un centro di accoglienza al CREAS della tua zona o chiama il 156. Anche il CRAI aiuta. L'Arsenal da Esperança è solo per uomini."}, "documentos": {"pt": "Vá primeiro ao CRAI (3) ou ao CIC do Imigrante (4). É grátis. Eles marcam seu horário na Polícia Federal. Para pedir refúgio, procure a Polícia Federal (1).", "es": "Ve primero al CRAI (3) o al CIC del Inmigrante (4). Es gratis. Ellos te dan una cita en la Policía Federal. Para pedir refugio, ve a la Policía Federal (1).", "en": "Go first to CRAI (3) or CIC do Imigrante (4). It is free. They book your appointment at the Federal Police. To ask for asylum, go to the Federal Police (1).", "fr": "Allez d'abord au CRAI (3) ou au CIC do Imigrante (4). C'est gratuit. Ils prennent votre rendez-vous à la Police fédérale. Pour demander l'asile, allez à la Police fédérale (1).", "ht": "Ale anvan nan CRAI (3) oswa nan CIC do Imigrante (4). Li gratis. Yo pran randevou pou ou nan Polis Federal. Pou mande refij, ale nan Polis Federal (1).", "ar": "اذهب أولاً إلى مركز CRAI (3) أو CIC do Imigrante (4). الخدمة مجانية. هم يحجزون لك موعداً في الشرطة الفيدرالية. لطلب اللجوء، اذهب إلى الشرطة الفيدرالية (1).", "ur": "پہلے CRAI (3) یا CIC do Imigrante (4) جائیں۔ یہ مفت ہے۔ وہ وفاقی پولیس میں آپ کا وقت مقرر کرتے ہیں۔ پناہ کی درخواست کے لیے وفاقی پولیس (1) جائیں۔", "fa": "اول به CRAI (3) یا CIC do Imigrante (4) بروید. رایگان است. آن‌ها برای شما در پولیس فدرال وقت می‌گیرند. برای درخواست پناهندگی به پولیس فدرال (1) بروید.", "ps": "لومړی CRAI (3) یا CIC do Imigrante (4) ته لاړ شئ. وړیا دی. هغوی په فدرالي پولیسو کې ستاسو لپاره وخت نیسي. د پناه غوښتنې لپاره فدرالي پولیسو (1) ته لاړ شئ.", "it": "Vai prima al CRAI (3) o al CIC do Imigrante (4). È gratis. Ti prenotano l'appuntamento alla Polizia Federale. Per chiedere asilo, vai alla Polizia Federale (1)."}, "familia": {"pt": "A Cruz Vermelha ajuda a falar com a família: ligações internacionais grátis, chip de celular com internet e busca de parentes.", "es": "La Cruz Roja te ayuda a hablar con tu familia: llamadas internacionales gratis, chip de celular con internet y búsqueda de familiares.", "en": "The Red Cross helps you contact your family: free international calls, a phone SIM card with internet and searching for relatives.", "fr": "La Croix-Rouge aide à contacter votre famille : appels internationaux gratuits, carte SIM avec internet et recherche de proches.", "ht": "Kwa Wouj ede w pale ak fanmi w: apèl entènasyonal gratis, chip telefòn ak entènèt ak rechèch fanmi.", "ar": "الصليب الأحمر يساعدك في التواصل مع عائلتك: مكالمات دولية مجانية، وشريحة هاتف مع إنترنت، والبحث عن الأقارب.", "ur": "ریڈ کراس خاندان سے رابطے میں مدد کرتا ہے: مفت بین الاقوامی کالیں، انٹرنیٹ والی موبائل سم، اور رشتہ داروں کی تلاش۔", "fa": "صلیب سرخ برای تماس با خانواده کمک می‌کند: تماس‌های بین‌المللی رایگان، سیم‌کارت با انترنت و جستجوی خویشاوندان.", "ps": "سور صلیب له کورنۍ سره په اړیکه کې مرسته کوي: وړیا نړیوال زنګونه، د انټرنیټ سره سیمکارت او د خپلوانو لټون.", "it": "La Croce Rossa aiuta a contattare la famiglia: chiamate internazionali gratuite, SIM con internet e ricerca dei parenti."}, "saude": {"pt": "Saúde é grátis no SUS. Vá a uma UBS com seu protocolo ou documento e o CPF. Não podem negar atendimento por falta de documento. Emergência: 192.", "es": "La salud es gratis en el SUS. Ve a una UBS con tu protocolo o documento y el CPF. No pueden negarte atención por falta de documentos. Emergencia: 192.", "en": "Health care is free at SUS. Go to a UBS clinic with your protocol or document and your CPF. You cannot be refused care for lack of documents. Emergency: 192.", "fr": "La santé est gratuite au SUS. Allez dans une UBS avec votre protocole ou document et le CPF. On ne peut pas vous refuser des soins faute de documents. Urgence : 192.", "ht": "Sante gratis nan SUS. Ale nan yon UBS ak pwotokòl ou oswa papye ou ak CPF ou. Yo pa ka refize w swen paske ou pa gen papye. Ijans: 192.", "ar": "العلاج مجاني في نظام SUS. اذهب إلى مركز صحي UBS ومعك البروتوكول أو الوثيقة ورقم CPF. لا يمكن رفض علاجك بسبب نقص الوثائق. الطوارئ: 192.", "ur": "SUS میں علاج مفت ہے۔ اپنے پروٹوکول یا دستاویز اور CPF کے ساتھ کسی UBS میں جائیں۔ دستاویز نہ ہونے پر علاج سے انکار نہیں کیا جا سکتا۔ ایمرجنسی: 192۔", "fa": "درمان در SUS رایگان است. با پروتوکول یا سند و CPF خود به یک UBS بروید. به خاطر نداشتن سند نمی‌توانند درمان را رد کنند. عاجل: ۱۹۲.", "ps": "درملنه په SUS کې وړیا ده. له خپل پروتوکول یا سند او CPF سره UBS ته لاړ شئ. د سند نه درلودو له امله درملنه نشي ردولی. بیړنۍ: ۱۹۲.", "it": "La sanità è gratuita nel SUS. Vai in una UBS con il protocollo o un documento e il CPF. Non possono rifiutarti le cure per mancanza di documenti. Emergenza: 192."}, "trabalho": {"pt": "O CAT da Prefeitura tem vagas de emprego. As organizações abaixo ajudam com currículo e cursos.", "es": "El CAT de la Prefectura tiene ofertas de empleo. Las organizaciones de abajo ayudan con el currículum y cursos.", "en": "The City Hall CAT has job offers. The organisations below help with CVs and courses.", "fr": "Le CAT de la Mairie a des offres d'emploi. Les organisations ci-dessous aident pour le CV et les formations.", "ht": "CAT Meri a gen travay disponib. Òganizasyon ki anba yo ede ak CV ak kou.", "ar": "مركز CAT التابع للبلدية لديه فرص عمل. المنظمات أدناه تساعد في السيرة الذاتية والدورات.", "ur": "بلدیہ کے CAT میں نوکریاں ہیں۔ نیچے دی گئی تنظیمیں سی وی اور کورسز میں مدد کرتی ہیں۔", "fa": "CAT شاروالی فرصت‌های کار دارد. سازمان‌های پایین در رزومه و کورس‌ها کمک می‌کنند.", "ps": "د ښاروالۍ CAT د کار فرصتونه لري. لاندې سازمانونه د سوانحو او کورسونو کې مرسته کوي.", "it": "Il CAT del Comune ha offerte di lavoro. Le organizzazioni qui sotto aiutano con il curriculum e i corsi."}, "portugues": {"pt": "Curso grátis de português (Portas Abertas) em escolas da Prefeitura, para maiores de 18 anos. Leve um documento (pode ser do seu país) e comprovante de endereço.", "es": "Curso gratis de portugués (Portas Abertas) en escuelas de la Prefectura, para mayores de 18 años. Lleva un documento (puede ser de tu país) y un comprobante de domicilio.", "en": "Free Portuguese course (Portas Abertas) in City Hall schools, for people over 18. Bring an ID (it can be from your country) and proof of address.", "fr": "Cours gratuit de portugais (Portas Abertas) dans les écoles de la Mairie, pour les plus de 18 ans. Apportez une pièce d'identité (même de votre pays) et un justificatif de domicile.", "ht": "Kou pòtigè gratis (Portas Abertas) nan lekòl Meri a, pou moun ki gen plis pase 18 an. Pote yon papye idantite (li ka soti nan peyi w) ak prèv adrès.", "ar": "دورة مجانية لتعلم البرتغالية (Portas Abertas) في مدارس البلدية، لمن عمره فوق 18 سنة. أحضر وثيقة هوية (يمكن أن تكون من بلدك) وإثبات عنوان.", "ur": "بلدیہ کے اسکولوں میں پرتگالی کا مفت کورس (Portas Abertas)، 18 سال سے زیادہ عمر والوں کے لیے۔ شناختی دستاویز (اپنے ملک کی بھی چلے گی) اور پتے کا ثبوت ساتھ لائیں۔", "fa": "کورس رایگان پرتگالی (Portas Abertas) در مکتب‌های شاروالی، برای بالای ۱۸ سال. یک سند هویت (از کشور خودتان هم قبول است) و سند آدرس بیاورید.", "ps": "د پرتګالي وړیا کورس (Portas Abertas) د ښاروالۍ په ښوونځیو کې، له ۱۸ کالو پورته لپاره. د پېژند سند (د خپل هېواد هم منل کېږي) او د پتې ثبوت راوړئ.", "it": "Corso gratuito di portoghese (Portas Abertas) nelle scuole del Comune, per maggiori di 18 anni. Porta un documento (anche del tuo paese) e una prova di residenza."}, "perigo": {"pt": "Se está em perigo agora, ligue 190. Mulheres: ligue 180, grátis, 24 horas. Racismo e outras violações de direitos: Disque 100.", "es": "Si estás en peligro ahora, llama al 190. Mujeres: llamen al 180, gratis, 24 horas. Racismo y otras violaciones de derechos: Disque 100.", "en": "If you are in danger now, call 190. Women: call 180, free, 24 hours. Racism and other rights violations: call 100.", "fr": "Si vous êtes en danger maintenant, appelez le 190. Femmes : appelez le 180, gratuit, 24 h/24. Racisme et autres violations des droits : appelez le 100.", "ht": "Si w an danje kounye a, rele 190. Fanm: rele 180, gratis, 24 èdtan. Rasis ak lòt vyolasyon dwa: rele 100.", "ar": "إذا كنت في خطر الآن، اتصل بـ 190. للنساء: اتصلي بـ 180، مجاني، على مدار 24 ساعة. العنصرية وانتهاكات الحقوق الأخرى: اتصل بـ 100.", "ur": "اگر آپ ابھی خطرے میں ہیں تو 190 پر کال کریں۔ خواتین: 180 پر کال کریں، مفت، 24 گھنٹے۔ نسل پرستی اور دیگر حقوق کی خلاف ورزی: 100 پر کال کریں۔", "fa": "اگر همین حالا در خطر هستید، به ۱۹۰ زنگ بزنید. زنان: به ۱۸۰ زنگ بزنید، رایگان و ۲۴ ساعته. نژادپرستی و دیگر نقض حقوق: به ۱۰۰ زنگ بزنید.", "ps": "که همدا اوس په خطر کې یاست، ۱۹۰ ته زنګ ووهئ. ښځې: ۱۸۰ ته زنګ ووهئ، وړیا، ۲۴ ساعته. توکمپالنه او د حقونو نور سرغړونې: ۱۰۰ ته زنګ ووهئ.", "it": "Se sei in pericolo adesso, chiama il 190. Donne: chiamate il 180, gratis, 24 ore su 24. Razzismo e altre violazioni dei diritti: chiama il 100."}}, "ORG_D": {"1": {"pt": "Documentos de migrante e pedido de refúgio. Precisa marcar horário.", "es": "Documentos de migrante y solicitud de refugio. Necesitas cita.", "en": "Migrant documents and asylum requests. Appointment needed.", "fr": "Documents de migrant et demande d'asile. Sur rendez-vous.", "ht": "Papye migran ak demann refij. Fòk ou gen randevou.", "ar": "وثائق المهاجرين وطلبات اللجوء. تحتاج إلى موعد.", "ur": "مہاجر دستاویزات اور پناہ کی درخواست۔ وقت لینا ضروری ہے۔", "fa": "اسناد مهاجر و درخواست پناهندگی. باید وقت بگیرید.", "ps": "د مهاجرو اسناد او د پناه غوښتنه. وخت نیول اړین دي.", "it": "Documenti per migranti e richiesta di asilo. Serve appuntamento."}, "2": {"pt": "Explica como pedir refúgio. Segunda a sexta, 10h–12h e 14h–15h30.", "es": "Explica cómo pedir refugio. Lunes a viernes, 10h–12h y 14h–15h30.", "en": "Explains how to ask for asylum. Mon–Fri, 10am–12pm and 2–3:30pm.", "fr": "Explique comment demander l'asile. Lun–ven, 10h–12h et 14h–15h30.", "ht": "Esplike kijan pou mande refij. Lendi rive vandredi, 10h–12h ak 14h–15h30.", "ar": "يشرح كيفية طلب اللجوء. من الاثنين إلى الجمعة، 10–12 و14–15:30.", "ur": "پناہ کی درخواست کا طریقہ بتاتا ہے۔ پیر تا جمعہ، 10–12 اور 14–15:30۔", "fa": "طریقهٔ درخواست پناهندگی را توضیح می‌دهد. دوشنبه تا جمعه، ۱۰–۱۲ و ۱۴–۱۵:۳۰.", "ps": "د پناه غوښتنې لاره تشریح کوي. دوشنبه تر جمعې، ۱۰–۱۲ او ۱۴–۱۵:۳۰.", "it": "Spiega come chiedere asilo. Lun–ven, 10–12 e 14–15:30."}, "3": {"pt": "Centro da Prefeitura para imigrantes. Ajuda com documentos, abrigo, trabalho e cursos.", "es": "Centro de la Prefectura para inmigrantes. Ayuda con documentos, albergue, trabajo y cursos.", "en": "City Hall centre for immigrants. Help with documents, shelter, work and courses.", "fr": "Centre de la Mairie pour immigrés. Aide pour documents, hébergement, travail et cours.", "ht": "Sant Meri a pou imigran. Èd ak papye, abri, travay ak kou.", "ar": "مركز البلدية للمهاجرين. مساعدة في الوثائق والمأوى والعمل والدورات.", "ur": "مہاجرین کے لیے بلدیہ کا مرکز۔ دستاویزات، پناہ، کا const ORGS = DATA.orgs, EXTRA = DATA.extra;

let L_ = null;
try{ const s = localStorage.getItem("rr_lang2"); if (s && I.UI[s]) L_ = s; }catch(e){}
const LANG = c => I.LANGS.find(l=>l[0]===c);
const t = k => I.UI[L_ || "pt"][k];
const tr = obj => obj[L_ || "pt"] || obj.pt;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hav = (a,b,c,d) => { const R=6371,p=Math.PI/180; const x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const fmtKm = k => "≈ " + k.toFixed(1).replace(".", ",") + " km";
const lineBadges = ls => `<span class="lines">${ls.map(n=>`<span class="ln" style="background:${LINE_COLORS[n]||"#777"}">L${n}</span>`).join("")}</span>`;
const gmaps = o => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(o.end.replace(" – ", ", ") + ", São Paulo - SP");
const flagImgs = codes => codes.map(c=>`<img src="${FLAGS[c]}" alt="">`).join("");
const orgD = o => tr(I.ORG_D[o.id] || {pt:o.d.pt});
const extraD = e => tr(I.EXTRA_D[e.nome] || {pt:e.d.pt});

/* step: 0 idioma, 1 lugar, 2 necessidades, 3 resultado */
const S = { tab:"A", step: L_ ? 1 : 0, here:null, zone:null, needs:new Set(), shown:new Set(Object.keys(I.TEMAS_T)), rail:true, q:"", ai:{turns:[], ctl:null, busy:false} };
let sample = null;

/* ---------- mapa ---------- */
const map = L.map("map", {zoomControl:true, attributionControl:false, minZoom:10, maxZoom:17, zoomSnap:0.5});
map.setMaxBounds(L.geoJSON(GEO.cidade).getBounds().pad(0.3));
map.fitBounds(L.latLngBounds([[-23.70,-46.80],[-23.43,-46.40]]));
["land","park","water","road","rail","label"].forEach((p,i)=>{ map.createPane(p).style.zIndex = 300+i*10; });
let layers = {};
function styleLayers(){
  Object.values(layers).forEach(l => l && map.removeLayer(l));
  layers.city = L.geoJSON(GEO.cidade, {pane:"land", interactive:false, style:{color:cssv("--navy"), weight:1.2, fillColor:cssv("--land"), fillOpacity:1}}).addTo(map);
  layers.dist = L.geoJSON(GEO.distritos, {pane:"land", interactive:false, style:{color:cssv("--land-edge"), weight:1, fill:false}}).addTo(map);
  layers.park = L.geoJSON(GEO.parques, {pane:"park", interactive:false, style:{stroke:false, fillColor:cssv("--park"), fillOpacity:1}}).addTo(map);
  layers.riv = L.geoJSON(GEO.rios, {pane:"water", interactive:false, style:f=>({color:cssv("--river"), weight:f.properties.main?3.2:1.6, opacity:1})}).addTo(map);
  layers.roadE = L.geoJSON(GEO.vias, {pane:"road", interactive:false, style:{color:cssv("--road-edge"), weight:5}}).addTo(map);
  layers.road = L.geoJSON(GEO.vias, {pane:"road", interactive:false, style:{color:cssv("--road"), weight:3}}).addTo(map);
  layers.rail = L.layerGroup();
  L.geoJSON(GEO.trilhos, {pane:"rail", interactive:false, style:f=>({color:LINE_COLORS[f.properties.n]||"#777", weight:f.properties.type==="metro"?3.6:2.6, opacity:.95, dashArray:f.properties.type==="train"?"6 3":null})}).addTo(layers.rail);
  GEO.estacoes.forEach(s => L.circleMarker([s.lat,s.lon], {pane:"rail", radius:3.4, color:cssv("--ink"), weight:1.3, fillColor:cssv("--panel"), fillOpacity:1}).bindTooltip(`${esc(s.name)} ${lineBadges(s.lines)}`, {direction:"top", offset:[0,-4]}).addTo(layers.rail));
  if (S.rail) layers.rail.addTo(map);
  layers.hubs = L.layerGroup().addTo(map);
  I.CHEGADA.forEach(([id,name,lat,lon,kind]) => L.marker([lat,lon], {icon:L.divIcon({className:"", html:`<div class="hub">${kind==="plane"?"✈️":"🚌"}</div>`, iconSize:[24,24], iconAnchor:[12,12]})}).bindTooltip(esc(name), {direction:"top", offset:[0,-10]}).addTo(layers.hubs));
  layers.labels = L.layerGroup().addTo(map);
  drawLabels();
}
function drawLabels(){
  layers.labels.clearLayers();
  const z = map.getZoom();
  if (z >= 12.5) GEO.distritos.features.forEach(f => L.marker(f.properties.c, {pane:"label", interactive:false, icon:L.divIcon({className:"", html:`<div class="dlabel">${esc(f.properties.n)}</div>`, iconSize:[120,14], iconAnchor:[60,7]})}).addTo(layers.labels));
  if (z >= 14 && S.rail) GEO.estacoes.forEach(s => { if (!map.getBounds().pad(0.2).contains([s.lat,s.lon])) return;
    L.marker([s.lat,s.lon], {pane:"label", interactive:false, icon:L.divIcon({className:"", html:`<div class="slabel">${esc(s.name)}</div>`, iconSize:[1,1], iconAnchor:[-7,6]})}).addTo(layers.labels); });
}
map.on("zoomend moveend", drawLabels);
const pins = {}; const pinLayer = L.layerGroup().addTo(map);
function drawPins(){
  pinLayer.clearLayers();
  ORGS.forEach(o => {
    if (!S.shown.has(o.tema)) return;
    const m = L.marker([o.lat,o.lon], {riseOnHover:true, title:o.nome, icon:L.divIcon({className:"", html:`<span class="pin" id="pin${o.id}" style="background:var(--${o.tema})">${o.id}</span>`, iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-14]})});
    m.bindPopup(() => `<b>${o.id}. ${esc(o.nome)}</b>${esc(orgD(o))}<br><span class="muted">${esc(o.end)}</span>${o.tel?`<br><span class="tel">${esc(o.tel)}</span>`:""}<br><a href="${gmaps(o)}" target="_blank" rel="noopener">${esc(t("route"))} ↗</a>`);
    m.on("click", () => highlight(o.id, false));
    pins[o.id] = m; m.addTo(pinLayer);
  });
}
let meMarker = null;
function setMe(){
  if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
  if (!S.here) return;
  meMarker = L.marker([S.here.lat,S.here.lon], {zIndexOffset:1000, icon:L.divIcon({className:"", html:`<div class="me-pin" title="${esc(t("you"))}"></div>`, iconSize:[18,18], iconAnchor:[9,9]})}).addTo(map);
}
function highlight(id, fly){
  document.querySelectorAll(".pin.on").forEach(e=>e.classList.remove("on"));
  const el = document.getElementById("pin"+id); if (el) el.classList.add("on");
  document.querySelectorAll(".card.sel").forEach(e=>e.classList.remove("sel"));
  const c = document.getElementById("card"+id); if (c) { c.classList.add("sel"); if (!fly) c.scrollIntoView({block:"nearest", behavior:"smooth"}); }
  const o = ORGS.find(x=>x.id===id);
  if (fly && o) { map.flyTo([o.lat,o.lon], Math.max(map.getZoom(),15), {duration:.6}); setTimeout(()=>pins[id] && pins[id].openPopup(), 650); }
}
const legend = L.control({position:"bottomright"});
legend.onAdd = () => { const d = L.DomUtil.create("div","maplegend"); d.id="maplegend"; L.DomEvent.disableClickPropagation(d); return d; };
legend.addTo(map);
function drawLegend(){
  const d = document.getElementById("maplegend");
  d.innerHTML = `<label><input type="checkbox" id="railchk" ${S.rail?"checked":""}> ${esc(t("legendRail"))}</label>`;
  d.querySelector("#railchk").onchange = e => { S.rail = e.target.checked; S.rail ? layers.rail.addTo(map) : map.removeLayer(layers.rail); drawLabels(); };
}

/* ---------- painel ---------- */
const view = document.getElementById("view");
const P = () => document.getElementById("panel");
function distOf(o){ return S.here ? hav(S.here.lat,S.here.lon,o.lat,o.lon) : null; }
function card(o, why){
  const d = distOf(o);
  const tags = why && why.length ? `<div class="why">${why.map(w=>`<span class="tag${w.c?" c":""}">${esc(w.l)}</span>`).join("")}</div>` : "";
  return `<article class="card" id="card${o.id}">
    <span class="num" style="background:var(--${o.tema})">${o.id}</span>
    <div class="nm">${esc(o.nome)}</div>
    <div class="ds">${esc(orgD(o))}</div>
    ${tags}
    <div class="ad">${esc(o.end)}</div>
    ${o.antigo?`<div class="note">${esc(t("old"))}</div>`:""}
    <div class="meta">${o.tel?`<span class="tel">${esc(o.tel)}</span>`:""}<span>${esc(t("near"))}: ${esc(o.est)} ${lineBadges(o.est_l)}</span>${d!=null?`<span>${fmtKm(d)}</span>`:""}</div>
    <div class="act"><button class="link" type="button" data-fly="${o.id}">${esc(t("seeMap"))}</button><a href="${gmaps(o)}" target="_blank" rel="noopener">${esc(t("route"))} ↗</a></div>
  </article>`;
}
const extraCard = e => `<div class="card"><span class="num" style="background:var(--muted)">☎</span><div class="nm">${esc(e.nome)}</div><div class="ds">${esc(extraD(e))}</div><div class="meta"><span class="tel">${esc(e.tel)}</span></div></div>`;
function bindCards(){ view.querySelectorAll("[data-fly]").forEach(b => b.onclick = () => { highlight(+b.dataset.fly, true); if (innerWidth<=860) document.getElementById("main").classList.add("mapbig"); }); }
const stepsBar = n => `<div class="steps" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`;

function renderLang(){
  view.innerHTML = `
    <h2>🌐 ${esc(I.UI[L_||"pt"].chooseLang)}</h2>
    <div class="multi">${I.LANGS.filter(l=>l[0]!==(L_||"pt")).map(l=>`<span dir="${l[2]}">${esc(I.UI[l[0]].chooseLang)}</span>`).join(" · ")}</div>
    <div class="langs">${I.LANGS.map(([c,name,dir,fl])=>`<button class="lb" type="button" data-l="${c}" lang="${c}" dir="${dir}" aria-pressed="${c===L_}"><span class="fl">${flagImgs(fl)}</span><b>${esc(name)}</b></button>`).join("")}</div>`;
  view.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { setLang(b.dataset.l); S.step = 1; S.tab="A"; render(); P().scrollTo({top:0}); });
}
function renderPlace(){
  view.innerHTML = `${stepsBar(1)}
    <p class="muted" style="margin:0">${esc(t("intro"))} <span class="free">${esc(t("free"))}</span></p>
    <h2>📍 ${esc(t("q1"))}</h2>
    <div class="note">${esc(t("q1h"))}</div>
    <div class="sub">${esc(t("arrive"))}</div>
    <div class="arr">${I.CHEGADA.map(([id,name,lat,lon,kind])=>`<button class="ab" type="button" data-hub="${id}"><span class="ic">${kind==="plane"?"✈️":"🚌"}</span><span>${esc(name)}</span></button>`).join("")}</div>
    <div class="search"><input id="stq" type="search" autocomplete="off" placeholder="🚇 ${esc(t("stPh"))}" aria-label="${esc(t("stPh"))}"><div class="sug" id="stsug" hidden></div></div>
    <div class="opts">${Object.entries(t("zones")).map(([k,v])=>`<button class="chip" type="button" data-zone="${k}">${esc(v)}</button>`).join("")}</div>`;
  const q = view.querySelector("#stq"), sug = view.querySelector("#stsug");
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  q.oninput = () => {
    const v = norm(q.value.trim()); if (!v){ sug.hidden = true; return; }
    const hits = GEO.estacoes.filter(s => norm(s.name).includes(v)).slice(0,7);
    sug.hidden = !hits.length;
    sug.innerHTML = hits.map(s => `<button type="button" data-st="${esc(s.name)}"><span>${esc(s.name)}</span>${lineBadges(s.lines)}</button>`).join("");
    sug.querySelectorAll("button").forEach(b => b.onclick = () => { const s = GEO.estacoes.find(x=>x.name===b.dataset.st); pickHere({name:s.name, lat:s.lat, lon:s.lon, lines:s.lines}); });
  };
  view.querySelectorAll("[data-hub]").forEach(b => b.onclick = () => { const h = I.CHEGADA.find(x=>x[0]===b.dataset.hub); pickHere({name:h[1], lat:h[2], lon:h[3]}); });
  view.querySelectorAll("[data-zone]").forEach(b => b.onclick = () => { const z=b.dataset.zone; if (ZONE_CENTER[z]) pickHere({name:t("zones")[z], lat:ZONE_CENTER[z][0], lon:ZONE_CENTER[z][1], zone:true}); else { S.here=null; setMe(); S.step=2; render(); } });
}
function pickHere(h){ S.here = h; setMe(); map.flyTo([h.lat,h.lon], h.zone?12:13.5, {duration:.6}); S.step = 2; render(); P().scrollTo({top:0}); }
function renderNeeds(){
  view.innerHTML = `${stepsBar(2)}
    ${S.here?`<div class="note">📍 ${esc(S.here.name)} · <button class="link" type="button" id="chg">${esc(t("restart"))}</button></div>`:""}
    <h2>${esc(t("q2"))}</h2>
    <div class="note">${esc(t("q2h"))}</div>
    <div class="needs">${Object.keys(NEED_ICON).map(k=>`<button class="nb${k==="perigo"?" danger":""}" type="button" data-need="${k}" aria-pressed="${S.needs.has(k)}"><span class="em" aria-hidden="true">${NEED_ICON[k]}</span><span>${esc(t("needs")[k])}</span></button>`).join("")}</div>
    <button class="go" id="goRes" type="button" ${S.needs.size?"":"disabled"}>${esc(t("cont"))}</button>`;
  view.querySelectorAll("[data-need]").forEach(b => b.onclick = () => { const k=b.dataset.need; S.needs.has(k)?S.needs.delete(k):S.needs.add(k); b.setAttribute("aria-pressed", S.needs.has(k)); view.querySelector("#goRes").disabled = !S.needs.size; });
  view.querySelector("#goRes").onclick = () => { S.step = 3; render(); fitResults(); P().scrollTo({top:0}); };
  const chg = view.querySelector("#chg"); if (chg) chg.onclick = () => { S.step=1; render(); };
}
function scoreOrgs(){
  const tags = new Set([...S.needs].flatMap(n=>NEED_TAGS[n]));
  const com = new Set((I.COMUNIDADE[L_]||[]));
  return ORGS.map(o => {
    const hitNeeds = [...S.needs].filter(n => NEED_TAGS[n].some(tg => o.needs.includes(tg)));
    const isCom = com.has(o.id);
    if (!hitNeeds.length && !isCom) return null;
    let s = hitNeeds.length*3 + (isCom?4:0) + (o.id===3?1:0);
    const d = distOf(o); if (d!=null) s += Math.max(0, 3 - d/4);
    const why = hitNeeds.map(n=>({l:NEED_ICON[n]+" "+t("needs")[n]})); if (isCom) why.unshift({l:t("community"), c:true});
    return {o, s, why};
  }).filter(Boolean).sort((a,b)=>b.s-a.s);
}
let lastRes = [];
function renderResults(){
  const res = scoreOrgs(); lastRes = res.slice(0,8).map(r=>r.o.id);
  const out = [stepsBar(3), `<h2>${esc(t("res"))}</h2><div class="free">${esc(t("free"))}</div>`];
  const nums = I.EMERG.filter(([n]) => (S.needs.has("perigo") && ["190","180","100"].includes(n)) || (S.needs.has("dormir") && n==="156") || (S.needs.has("comida") && n==="156") || (S.needs.has("saude") && n==="192"));
  if (nums.length) out.push(`<div class="alert" role="note"><strong>${esc(t("urgent"))}</strong>${nums.map(([n,l])=>`<div><span class="tel">${n}</span> · ${esc(tr(l))}</div>`).join("")}</div>`);
  [...S.needs].forEach(n => out.push(`<div class="guide"><h3><span aria-hidden="true">${NEED_ICON[n]}</span>${esc(t("needs")[n])}</h3><div class="small">${esc(tr(I.GUIDE[n]))}</div></div>`));
  if (!res.length && !S.needs.has("familia")) out.push(`<p>${esc(t("none"))}</p>`);
  res.slice(0,8).forEach(r => out.push(card(r.o, r.why)));
  const tags = new Set([...S.needs].flatMap(n=>NEED_TAGS[n]));
  const ex = EXTRA.filter(e => e.needs.some(n=>tags.has(n)));
  if (ex.length){ out.push(`<h3>${esc(t("alsoContact"))}</h3>`); ex.forEach(e => out.push(extraCard(e))); }
  out.push(`<div class="ai" id="aibox" hidden><h3>💬 ${esc(t("aiT"))}</h3><div class="note">${esc(t("aiN"))}</div><div class="log" id="ailog"></div>
    <textarea id="aiq" placeholder="${esc(t("aiPh"))}" aria-label="${esc(t("aiPh"))}"></textarea>
    <div class="row"><button class="go" id="aisend" type="button">${esc(t("send"))}</button><button class="link" id="aistop" type="button" hidden>${esc(t("stop"))}</button></div></div>`);
  out.push(`<button class="link back" id="again" type="button">↺ ${esc(t("restart"))}</button>`);
  view.innerHTML = out.join("");
  view.querySelector("#again").onclick = restart;
  bindCards(); bindAI();
}
function fitResults(){
  const pts = ORGS.filter(o=>lastRes.includes(o.id)).map(o=>[o.lat,o.lon]);
  if (S.here) pts.push([S.here.lat,S.here.lon]);
  if (pts.length) map.flyToBounds(L.latLngBounds(pts).pad(0.25), {duration:.7, maxZoom:14});
  lastRes.forEach(id=>{ const el=document.getElementById("pin"+id); if(el) el.classList.add("on"); });
  setTimeout(()=>lastRes.forEach(id=>{ const el=document.getElementById("pin"+id); if(el) el.classList.remove("on"); }), 2200);
}

/* ---------- IA (opcional: só para quem tem conta Claude) ---------- */
function aiRules(){
  const orgs = ORGS.map(o => `${o.id}. ${o.nome} | ${I.ORG_D[o.id].pt} | ${o.end} | tel ${o.tel||"-"} | serve para: ${o.needs.join(",")}${o.antigo?" | endereço de fonte antiga":""}`).join("\n");
  const extra = EXTRA.map(e=>`- ${e.nome} | ${I.EXTRA_D[e.nome]?I.EXTRA_D[e.nome].pt:e.d.pt} | ${e.tel}`).join("\n");
  const guide = Object.entries(I.GUIDE).map(([k,v])=>`- ${I.UI.pt.needs[k]}: ${v.pt}`).join("\n");
  return `Você é a assistente do guia Rede Refúgio São Paulo (trabalho acadêmico). Você ajuda imigrantes e refugiados recém-chegados a encontrar apoio gratuito na cidade de São Paulo.
Como falar:
- Responda em ${LANG(L_||"pt")[1]}, a menos que a pessoa escreva em outra língua; então use a língua dela.
- Use palavras muito simples e frases curtas, como para alguém cansado, com medo e que está aprendendo a língua. No máximo 5 frases curtas ou uma lista de até 4 itens.
- Diga primeiro o que a pessoa deve fazer agora. Depois, onde ir (nome e número no mapa, ex.: "CRAI (nº 3)") e o telefone.
Regras:
- Indique SOMENTE organizações e telefones da lista abaixo. Não invente endereços, horários, documentos exigidos nem prazos.
- Se não souber, diga isso e indique o CRAI (nº 3).
- Perigo agora: 190. Mulher em perigo: 180. Doença grave: 192.
- Não peça números de documentos, endereço exato nem dados pessoais. Não prometa resultado de refúgio ou residência. Para dúvidas legais, indique a Defensoria Pública da União ou as organizações com ajuda jurídica.
Situação da pessoa: está em ${S.here?S.here.name:"lugar não informado"}; precisa de: ${[...S.needs].map(n=>I.UI.pt.needs[n]).join(", ")||"não informado"}.
Organizações no mapa:
${orgs}
Por telefone ou internet:
${extra}
Orientações:
${guide}
Telefones: 190 polícia; 192 ambulância; 180 mulheres; 100 direitos humanos; 156 Prefeitura (abrigo, CRAS).`;
}
function bindAI(){
  const box = view.querySelector("#aibox"); if (!box) return;
  const log = box.querySelector("#ailog");
  const paint = () => { log.innerHTML = S.ai.turns.map(x=>`<div class="bub${x.role==="user"?" me":""}">${esc(x.content)}</div>`).join(""); };
  paint();
  if (!sample) return;
  box.hidden = false;
  const send = box.querySelector("#aisend"), stop = box.querySelector("#aistop"), ta = box.querySelector("#aiq");
  stop.onclick = () => S.ai.ctl && S.ai.ctl.abort();
  send.onclick = async () => {
    const msg = ta.value.trim(); if (!msg || S.ai.busy) return;
    S.ai.turns.push({role:"user", content:msg}); ta.value=""; paint();
    const bub = document.createElement("div"); bub.className="bub"; bub.textContent=t("thinking"); log.appendChild(bub);
    S.ai.busy = true; send.disabled = true; stop.hidden = false; S.ai.ctl = new AbortController();
    try{
      const {text} = await sample([{role:"user", content:aiRules()}, ...S.ai.turns.slice(-10)], {cache:false, signal:S.ai.ctl.signal, onText:({text})=>{ bub.textContent = text; }});
      S.ai.turns.push({role:"assistant", content:text});
    }catch(e){
      if (e && e.code === "cancelled"){ if (e.text) S.ai.turns.push({role:"assistant", content:e.text}); }
      else if (e && ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){ sample = null; box.innerHTML = `<div class="note">${esc(t("aiOff"))}</div>`; return; }
      else { bub.textContent = (e && e.text ? e.text + "\n\n" : "") + t("aiErr"); }
    }finally{ S.ai.busy=false; send.disabled=false; stop.hidden=true; }
    paint();
  };
}

/* ---------- lista ---------- */
function renderList(){
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const fs = Object.entries(I.TEMAS_T).map(([k,v])=>`<button class="fchip" type="button" data-th="${k}" aria-pressed="${S.shown.has(k)}"><i style="background:var(--${k})"></i>${esc(tr(v))}</button>`).join("");
  let items = ORGS.filter(o => S.shown.has(o.tema) && (!S.q || norm(o.nome+" "+o.end+" "+orgD(o)).includes(norm(S.q))));
  if (S.here) items = items.slice().sort((a,b)=>distOf(a)-distOf(b));
  view.innerHTML = `<h2>${esc(t("listT"))}</h2><div class="free">${esc(t("free"))}</div>
    <div class="filters">${fs}</div>
    <div class="search"><input id="lq" type="search" value="${esc(S.q)}" placeholder="${esc(t("search"))}" aria-label="${esc(t("search"))}"></div>
    ${S.here?`<div class="note">${esc(t("sortNear"))} ${esc(S.here.name)} · <button class="link" id="clr" type="button">${esc(t("clear"))}</button></div>`:""}
    ${items.map(o=>card(o)).join("")}
    <h3>${esc(t("alsoContact"))}</h3>${EXTRA.map(extraCard).join("")}`;
  view.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { const k=b.dataset.th; S.shown.has(k)?S.shown.delete(k):S.shown.add(k); drawPins(); renderList(); });
  const lq = view.querySelector("#lq"); lq.oninput = () => { S.q = lq.value; const pos = lq.selectionStart; renderList(); const n = view.querySelector("#lq"); n.focus(); n.setSelectionRange(pos,pos); };
  const clr = view.querySelector("#clr"); if (clr) clr.onclick = () => { S.here=null; setMe(); renderList(); };
  bindCards();
}

/* ---------- moldura ---------- */
function setLang(c){ L_ = c; try{ localStorage.setItem("rr_lang2", c); }catch(e){} }
function restart(){ S.step = 1; S.here = null; S.needs.clear(); S.ai.turns = []; setMe(); S.tab = "A"; render(); P().scrollTo({top:0}); }
function render(){
  const lg = LANG(L_ || "pt");
  document.documentElement.lang = L_ || "pt";
  document.documentElement.dir = lg[2];
  const bl = document.getElementById("btnLang");
  bl.innerHTML = L_ ? `${flagImgs(lg[3].slice(0,1))}<span>${esc(lg[1])}</span>` : `🌐`;
  bl.title = I.UI[L_||"pt"].chooseLang;
  const br = document.getElementById("btnRestart"); br.textContent = "↺ " + t("restart"); br.hidden = S.step < 2;
  document.getElementById("tabs").hidden = S.step === 0;
  document.getElementById("tabA").textContent = t("tabA");
  document.getElementById("tabL").textContent = t("tabL");
  document.getElementById("tabA").setAttribute("aria-selected", S.tab==="A");
  document.getElementById("tabL").setAttribute("aria-selected", S.tab==="L");
  document.getElementById("src").textContent = t("src");
  drawLegend(); drawPins();
  if (S.step === 0) return renderLang();
  if (S.tab === "L") return renderList();
  if (S.step === 1) return renderPlace();
  if (S.step === 2) return renderNeeds();
  return renderResults();
}
document.getElementById("btnLang").onclick = () => { S.step = 0; render(); P().scrollTo({top:0}); };
document.getElementById("btnRestart").onclick = restart;
document.getElementById("tabA").onclick = () => { S.tab="A"; render(); };
document.getElementById("tabL").onclick = () => { S.tab="L"; render(); };
document.getElementById("panel").addEventListener("pointerdown", () => { if (innerWidth<=860) document.getElementById("main").classList.remove("mapbig"); });
document.getElementById("map").addEventListener("pointerdown", () => { if (innerWidth<=860) document.getElementById("main").classList.add("mapbig"); });

styleLayers(); render();
const restyle = () => { styleLayers(); drawPins(); };
const mq = matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener && mq.addEventListener("change", restyle);
new MutationObserver(restyle).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));
(async () => {
  try{ if (window.claude && window.claude.use){ const s = await window.claude.use("sample"); if (s){ sample = s; if (S.tab==="A" && S.step===3) bindAI(); } } }catch(e){}
})();
</script>
